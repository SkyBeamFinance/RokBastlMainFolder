name: PDF → Markdown Conversion

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: "Commit generated md/ files back to the branch"
        type: boolean
        default: true
  push:
    paths:
      - "**.pdf"
      - "**.PDF"
      - "tools/pdf_to_md/**"

# Restrict default GITHUB_TOKEN permissions to read-only; the convert job
# explicitly elevates contents: write only for the push step.
permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    # Only this job needs write access to commit generated Markdown back.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # Pinned to v4.1.7 commit SHA to guard against tag-hijacking.
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python
        # Pinned to v5.3.0 commit SHA.
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/pdf_to_md/requirements.txt

      - name: Run PDF → Markdown converter
        run: python tools/pdf_to_md/convert.py

      - name: Upload md/ as artifact
        # Pinned to v4.3.1 commit SHA.
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: converted-markdown
          path: md/
          if-no-files-found: warn

      - name: Commit generated Markdown back to branch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_back == true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add md/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate md/ from PDFs [skip ci]"
            git push
          fi
